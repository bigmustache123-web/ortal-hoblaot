<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אורטל הובלות - מערכת לידים</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      color: #cbd5e1;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat {
      background: #eef2ff;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-bottom: 6px;
    }

    .lead {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .lead strong {
      display: block;
      margin-bottom: 5px;
    }

    .status {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin-top: 8px;
    }

    .empty {
      color: #6b7280;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🚚 אורטל הובלות</h1>
    <p>מערכת AI לניהול וסגירת לקוחות</p>
  </div>

  <div class="container">

    <div class="card">
      <h2>סקירה</h2>

      <div class="stats">
        <div class="stat">
          <strong id="leadsCount">0</strong>
          לידים
        </div>

        <div class="stat">
          <strong id="messagesCount">0</strong>
          הודעות
        </div>
      </div>
    </div>

    <div class="card">
      <h2>לידים אחרונים</h2>

      <div id="leadsList" class="empty">
        עדיין אין לידים במערכת
      </div>
    </div>

    <div class="card">
      <h2>סוכן AI</h2>
      <p>
        בהמשך הסוכן יקבל הודעות מלקוחות,
        ישמור אותן במערכת,
        יאסוף את פרטי ההובלה
        ויעזור לך לסגור את הלקוח.
      </p>
    </div>

  </div>
</body>
</html>
